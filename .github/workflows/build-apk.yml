name: Build Subh Vivah APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'keystore/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure fixed signing keystore (one time)
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.jks ]; then
            echo "Generating fixed keystore…"
            keytool -genkeypair -v -keystore keystore/release.jks -alias shubhvivah \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass svivah123 -keypass svivah123 \
              -dname "CN=Shubh Vivah, OU=App, O=Project9793, L=Prayagraj, S=UP, C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/release.jks
            git commit -m "Add fixed signing keystore"
            git push
          else
            echo "Keystore already present."
          fi

      - name: Unzip project
        run: |
          mkdir -p build-src
          unzip -q SubhVivah-Android.zip -d build-src
          ls build-src/SubhVivahApp

      - name: Copy keystore into project
        run: |
          mkdir -p build-src/SubhVivahApp/keystore
          cp keystore/release.jks build-src/SubhVivahApp/keystore/release.jks

      - name: Build debug APK
        working-directory: build-src/SubhVivahApp
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subh-vivah-debug-apk
          path: build-src/SubhVivahApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release (apk-latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Shubh Vivah APK (latest)
          files: build-src/SubhVivahApp/app/build/outputs/apk/debug/*.apk
          make_latest: true
        continue-on-error: true
